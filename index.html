<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<title>Dont Trust</title>
<style>
:root{
  --bg:#0a0a0f;--bg-card:#12121a;--bg-hover:#1a1a25;--border:#2a2a35;
  --text:#d8d8d8;--text-dim:#777;--text-faint:#444;
  --accent:#b894d9;--accent-dim:#5a3a7a;
  --danger:#ff4466;--danger-dim:#551122;
  --gold:#ffd700;--green:#4ec9b0;--blue:#5b9bd5;--orange:#e8943a;
  --era-c:#5b9bd5;--era-k:#e8943a;--era-j:#4ec9b0;--era-t:#ff4466;
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 4px 20px rgba(0,0,0,.5);
  --shadow-lg:0 8px 40px rgba(0,0,0,.7);
  --radius:4px;
  --radius-lg:8px;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
  --transition-slow:all .4s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--text);
  font-family:'Georgia','Noto Serif SC','Microsoft YaHei',serif;
  font-size:16px;line-height:1.9;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overscroll-behavior-y:contain;
  -webkit-touch-callout:none;
}
button,select,input{font-family:inherit;-webkit-appearance:none;appearance:none}
input{border-radius:0}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(184,148,217,.06),transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(255,68,102,.04),transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  opacity:.02;mix-blend-mode:overlay;
}
#app{
  max-width:680px;margin:0 auto;padding:0 16px;min-height:100vh;
  display:flex;flex-direction:column;
  transition:max-width .3s ease;
  position:relative;z-index:1;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.title-screen{
  text-align:center;padding:100px 20px 60px;
  animation:titleReveal 1.2s cubic-bezier(.2,.8,.2,1) both;
  min-height:80vh;display:flex;flex-direction:column;justify-content:center;
}
.title-screen h1{
  font-size:56px;letter-spacing:12px;font-weight:300;
  margin-bottom:16px;color:var(--text);
  text-shadow:0 0 40px rgba(184,148,217,.2),0 0 80px rgba(184,148,217,.1);
  animation:titleGlow 4s ease-in-out infinite alternate;
  position:relative;
}
.title-screen h1::after{
  content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.title-screen .subtitle{
  color:var(--text-dim);font-size:14px;margin-bottom:64px;
  letter-spacing:4px;margin-top:24px;
  opacity:0;animation:fadeInUp .8s .4s ease forwards;
}
.title-screen .btn-group{
  opacity:0;animation:fadeInUp .8s .7s ease forwards;
  flex-direction:column;gap:12px;align-items:center;
}
.title-screen .btn{
  min-width:180px;padding:14px 36px;font-size:15px;
  letter-spacing:2px;
}
.title-screen .hint{
  opacity:0;animation:fadeInUp .6s 1s ease forwards;
  margin-top:20px;font-size:12px;color:var(--text-dim);
}
@keyframes titleReveal{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes titleGlow{
  from{text-shadow:0 0 30px rgba(184,148,217,.15),0 0 60px rgba(184,148,217,.08)}
  to{text-shadow:0 0 50px rgba(184,148,217,.25),0 0 100px rgba(184,148,217,.12)}
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.btn{
  background:var(--bg-card);color:var(--text);
  border:1px solid var(--border);padding:10px 28px;
  cursor:pointer;font-family:inherit;font-size:14px;
  transition:var(--transition);border-radius:var(--radius);
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  transition:left .4s ease;
}
.btn:hover::before{left:100%}
.btn:hover{
  background:var(--bg-hover);border-color:var(--accent);
  box-shadow:var(--shadow-sm);transform:translateY(-1px);
}
.btn:active{transform:translateY(0);box-shadow:none}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-dim),rgba(184,148,217,.2));
  border-color:var(--accent);color:#fff;
}
.btn-primary:hover{
  background:linear-gradient(135deg,var(--accent),rgba(184,148,217,.4));
  box-shadow:0 4px 20px rgba(184,148,217,.3);
}
.btn-danger{
  border-color:var(--danger-dim);color:var(--danger);
  background:rgba(255,68,102,.04);
}
.btn-danger:hover{
  background:var(--danger-dim);color:#fff;
  box-shadow:0 4px 20px rgba(255,68,102,.25);
}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn:disabled:hover::before{left:-100%}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.story{flex:1;padding:24px 0}
.story p{margin-bottom:16px}
.story .narrator{color:var(--text-dim);font-style:italic;border-left:2px solid var(--border);padding-left:12px;margin:16px 0}
.story .pulse{color:var(--danger);font-style:italic;padding:10px 0 10px 16px;border-left:2px solid var(--danger);margin:12px 0;background:rgba(255,68,102,.04);white-space:pre-wrap;border-radius:0 var(--radius) var(--radius) 0}
.story .era-tag{font-size:11px;padding:1px 6px;border-radius:2px;display:inline-block}
.story .thought{color:var(--text-dim);font-style:italic}

.choices{
  padding:20px 0 28px;display:flex;flex-direction:column;gap:10px;
}
.choice-btn{
  background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);padding:14px 18px;cursor:pointer;
  font-family:inherit;font-size:14px;text-align:left;
  transition:var(--transition);border-radius:var(--radius);
  line-height:1.6;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.choice-btn::after{
  content:'→';color:var(--text-faint);font-size:12px;
  transition:var(--transition);flex-shrink:0;
}
.choice-btn:hover{
  background:var(--bg-hover);border-color:var(--accent);
  transform:translateX(4px);box-shadow:var(--shadow-sm);
}
.choice-btn:hover::after{
  color:var(--accent);transform:translateX(4px);
}
.choice-btn:active{transform:translateX(2px)}
.choice-btn .choice-hint{
  font-size:11px;color:var(--text-dim);display:block;margin-top:4px;
}
.choice-btn.danger:hover{
  border-color:var(--danger);background:rgba(255,68,102,.06);
}
.choice-btn.danger:hover::after{color:var(--danger)}

/* === Day Choices Layout === */
.day-choices{padding:12px 0 20px}
.dc-actions-left{
  font-size:12px;color:var(--text-dim);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.dc-actions-left .dc-count{
  color:var(--accent);font-weight:700;font-size:14px;
  background:rgba(184,148,217,.1);padding:2px 8px;border-radius:3px;
}
.dc-section-label{
  font-size:10px;color:var(--text-faint);letter-spacing:2px;
  text-transform:uppercase;margin:16px 0 8px;padding-left:2px;
}
.dc-main{
  display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
}
.dc-main .choice-btn{
  font-size:15px;padding:16px 18px;
  background:linear-gradient(135deg,var(--bg-card),rgba(26,26,37,.8));
  border:1px solid var(--border);
}
.dc-main .choice-btn:hover{
  border-color:var(--accent);
  background:linear-gradient(135deg,var(--bg-hover),rgba(26,26,37,.6));
  box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 12px rgba(184,148,217,.08);
  transform:translateX(4px);
}
.dc-main .choice-btn .choice-hint{
  font-size:12px;margin-top:4px;
}
.dc-event{
  border-color:var(--gold)!important;
  background:linear-gradient(135deg,rgba(255,215,0,.06),var(--bg-card))!important;
}
.dc-event:hover{
  border-color:var(--gold)!important;
  background:linear-gradient(135deg,rgba(255,215,0,.12),var(--bg-hover))!important;
  box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 12px rgba(255,215,0,.1)!important;
}
.dc-event .choice-hint{color:var(--gold)!important}
.dc-end-day{
  border-color:var(--text-faint)!important;
  background:rgba(0,0,0,.2)!important;
}
.dc-end-day:hover{
  border-color:var(--text-dim)!important;
  background:rgba(0,0,0,.3)!important;
  box-shadow:none!important;
}
.dc-secondary{
  display:flex;flex-direction:column;gap:6px;margin-bottom:16px;
}
.dc-secondary .choice-btn{
  font-size:13px;padding:10px 14px;
  background:rgba(18,18,26,.6);
  border:1px solid rgba(42,42,53,.6);
}
.dc-secondary .choice-btn:hover{
  border-color:var(--accent);
  background:var(--bg-hover);
  transform:translateX(2px);
  box-shadow:var(--shadow-sm);
}
.dc-secondary .choice-btn .choice-hint{
  font-size:11px;
}
.dc-utility{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-top:12px;padding-top:14px;
  border-top:1px solid var(--border);
}
.dc-utility-item{
  background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);font-size:12px;padding:10px 4px;
  cursor:pointer;transition:var(--transition);border-radius:var(--radius);
  text-align:center;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.dc-utility-item .dcu-icon{
  display:flex;align-items:center;justify-content:center;
}
.dc-utility-item .dcu-icon svg{
  width:18px;height:18px;stroke:var(--accent);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.dc-utility-item:hover{
  border-color:var(--accent);color:var(--text);
  background:var(--bg-hover);
}
.dc-utility-item:active{transform:scale(.97)}
.dc-debug{
  margin-top:10px;text-align:center;
}
.dc-debug button{
  font-size:10px;color:var(--text-faint);
  background:none;border:1px dashed var(--border);
  padding:4px 10px;cursor:pointer;border-radius:var(--radius);
  transition:var(--transition);font-family:inherit;
}
.dc-debug button:hover{
  color:var(--text-dim);border-color:var(--text-faint);
}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0 8px;border-bottom:1px solid var(--border);
  margin-bottom:10px;font-size:11px;color:var(--text-dim);
  flex-wrap:wrap;gap:6px 10px;
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:10;
  background:rgba(10,10,15,.85);
  margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;
}
.topbar .stat{
  display:flex;align-items:center;gap:4px;
}
.topbar .stat span{
  color:var(--text);font-weight:600;font-size:12px;
}
.topbar .stat.danger span{color:var(--danger)}
.topbar .stat.gold span{color:var(--gold)}
.topbar .era-badge{font-size:10px;padding:1px 6px;border-radius:2px;color:#000}
.topbar .menu-btn{
  cursor:pointer;color:var(--text-dim);font-size:12px;
  border:1px solid var(--border);padding:3px 10px;
  border-radius:var(--radius);transition:var(--transition);
  background:var(--bg-card);
}
.topbar .menu-btn:hover{
  color:var(--text);border-color:var(--accent);background:var(--bg-hover);
}

.progress-bar-wrap{
  margin-bottom:12px;padding:0 2px;
}
.progress-bar-info{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:var(--text-dim);margin-bottom:4px;
}
.progress-bar-info .pbi-phase{
  font-weight:700;font-size:11px;letter-spacing:1px;
}
.progress-bar-info .pbi-phase.p1{color:var(--accent)}
.progress-bar-info .pbi-phase.p2{color:var(--gold)}
.progress-bar-info .pbi-phase.p3{color:var(--danger)}
.progress-bar-track{
  height:6px;background:rgba(255,255,255,.06);
  border-radius:3px;overflow:hidden;position:relative;
}
.progress-bar-fill{
  height:100%;border-radius:3px;
  transition:width .6s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.progress-bar-fill::after{
  content:'';position:absolute;top:0;right:0;width:20px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3));
}
.progress-bar-fill.p1{background:linear-gradient(90deg,var(--accent),#7ab8e0)}
.progress-bar-fill.p2{background:linear-gradient(90deg,var(--gold),#ffd966)}
.progress-bar-fill.p3{background:linear-gradient(90deg,var(--danger),#ff6b6b)}
.progress-bar-markers{
  display:flex;justify-content:space-between;font-size:8px;color:var(--text-dim);
  margin-top:3px;letter-spacing:.5px;
}
.progress-bar-markers span{position:relative}
.progress-bar-markers span.passed{color:var(--text)}
.progress-bar-markers span.current{color:var(--gold);font-weight:700}

.char-pick{
  display:flex;flex-direction:column;gap:8px;padding:12px 0;
}
.char-pick-item{
  background:var(--bg-card);border:1px solid var(--border);
  padding:12px 16px;cursor:pointer;transition:var(--transition);
  border-radius:var(--radius);position:relative;
  display:flex;align-items:flex-start;gap:12px;
}
.char-pick-item:hover{
  background:var(--bg-hover);border-color:var(--accent);
  transform:translateX(3px);box-shadow:var(--shadow-sm);
}
.char-pick-item:active{transform:translateX(1px)}
.char-pick-item .cp-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#000;
}
.char-pick-item .cp-content{flex:1;min-width:0}
.char-pick-item .cp-name{
  font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.char-pick-item .cp-code{
  font-size:11px;letter-spacing:.5px;opacity:.7;
  font-family:monospace;
}
.char-pick-item .cp-era{
  font-size:9px;padding:1px 5px;border-radius:2px;
  display:inline-block;color:#000;font-weight:600;
}
.char-pick-item .cp-level{font-size:10px;display:inline-block}
.char-pick-item .cp-info{
  font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;
}
.char-pick-item .cp-suspect{color:var(--danger);font-size:10px;font-weight:600}
.char-pick-item.eliminated{opacity:.35;cursor:default}
.char-pick-item.eliminated .cp-name{text-decoration:line-through}

.evidence-panel{padding:16px 0}
.evidence-item{
  background:var(--bg-card);border:1px solid var(--border);
  padding:14px 16px;margin-bottom:10px;border-radius:var(--radius);
  transition:var(--transition);position:relative;overflow:hidden;
}
.evidence-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--border);transition:background .2s ease;
}
.evidence-item:hover{
  border-color:var(--accent);box-shadow:var(--shadow-sm);
  transform:translateX(2px);
}
.evidence-item:hover::before{background:var(--accent)}
.evidence-item.high-conf::before{background:var(--danger)}
.evidence-item .ev-name{
  font-weight:600;font-size:14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.evidence-item .ev-conf{
  font-size:11px;color:var(--text-dim);font-weight:400;
  display:flex;align-items:center;gap:6px;
}
.evidence-item .ev-conf .conf-val{
  font-weight:700;font-family:monospace;
}
.conf-bar{
  width:80px;height:8px;background:var(--border);
  border-radius:4px;display:inline-block;vertical-align:middle;
  overflow:hidden;position:relative;
}
.conf-fill{
  height:100%;border-radius:4px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,var(--accent),var(--danger));
}
.evidence-item .ev-clue{
  display:block;font-size:12px;color:var(--text-dim);
  padding:6px 0 6px 10px;border-left:2px solid var(--border);
  margin:4px 0;line-height:1.6;
}
.evidence-item .ev-clue.pulse{
  color:var(--danger);border-left-color:var(--danger);
  background:rgba(255,68,102,.03);border-radius:0 var(--radius) var(--radius) 0;
}
.evidence-item .ev-clue.behavior{
  color:var(--accent);border-left-color:var(--accent-dim);
}

.save-list{padding:16px 0}
.save-item{
  background:var(--bg-card);border:1px solid var(--border);
  padding:14px 16px;margin-bottom:10px;border-radius:var(--radius);
  display:flex;justify-content:space-between;align-items:center;
  transition:var(--transition);
}
.save-item:hover{
  border-color:var(--accent);box-shadow:var(--shadow-sm);
  transform:translateX(2px);
}
.save-item .si-meta{font-size:11px;color:var(--text-dim)}

.confront-box{
  background:var(--bg-card);border:2px solid var(--danger);
  padding:28px 24px;border-radius:var(--radius-lg);
  text-align:center;margin:24px 0;
  box-shadow:0 0 30px rgba(255,68,102,.12);
  position:relative;overflow:hidden;
}
.confront-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--danger),transparent);
  animation:pulseLine 2s ease-in-out infinite;
}
@keyframes pulseLine{
  0%,100%{opacity:.5}
  50%{opacity:1}
}
.confront-box h2{
  color:var(--danger);margin-bottom:16px;
  font-size:20px;letter-spacing:2px;
}
.confront-box .warning{
  color:var(--danger);font-size:13px;margin:16px 0;
  line-height:1.7;
}

.ending{
  text-align:center;padding:60px 20px;
  animation:endingReveal 1.2s cubic-bezier(.2,.8,.2,1) both;
  min-height:80vh;display:flex;flex-direction:column;justify-content:center;
}
.ending h1{
  font-size:36px;margin-bottom:16px;
  letter-spacing:6px;font-weight:300;
  position:relative;
}
.ending h1::after{
  content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);
}
.ending.gold h1{
  color:var(--gold);
  text-shadow:0 0 30px rgba(255,215,0,.3),0 0 60px rgba(255,215,0,.15);
}
.ending.silver h1{
  color:var(--accent);
  text-shadow:0 0 30px rgba(184,148,217,.3),0 0 60px rgba(184,148,217,.15);
}
.ending.black h1{
  color:var(--text-dim);
  text-shadow:0 0 20px rgba(119,119,119,.2);
}
.ending .ed-tier{
  font-size:12px;letter-spacing:4px;
  margin-bottom:24px;margin-top:20px;
  opacity:0;animation:fadeInUp .8s .3s ease forwards;
}
.ending.gold .ed-tier{color:var(--gold)}
.ending.silver .ed-tier{color:var(--accent)}
.ending.black .ed-tier{color:var(--text-dim)}
.ending .ed-desc{
  max-width:500px;margin:24px auto;font-size:14px;
  color:var(--text-dim);line-height:2;
  opacity:0;animation:fadeInUp .8s .6s ease forwards;
}
.ending .ed-detail{
  max-width:500px;margin:16px auto;font-size:13px;
  color:var(--text-faint);line-height:1.8;
  opacity:0;animation:fadeInUp .8s .9s ease forwards;
}
.ending .btn-group{
  margin-top:32px;
  opacity:0;animation:fadeInUp .8s 1.2s ease forwards;
}
@keyframes endingReveal{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}

.page{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* === Photocard visual === */
.photocard{
  width:200px;height:280px;border-radius:10px;overflow:hidden;
  position:relative;margin:16px auto;
  box-shadow:var(--shadow-md);
  animation:cardReveal .5s cubic-bezier(.2,.8,.2,1) both;
  transition:var(--transition-slow);
  cursor:pointer;
}
.photocard:hover{

function toggleDanmaku(){
  DM_ON=!DM_ON;
  var layer=document.getElementById('danmaku-layer');
  var toggle=document.getElementById('danmaku-toggle');
  var inputWrap=document.getElementById('danmaku-input-wrap');

  if(DM_ON){
    layer.style.display='block';
    inputWrap.style.display='flex';
    toggle.classList.add('on');
    toggle.textContent='✕';
    startDanmaku();
  } else {
    layer.style.display='none';
    inputWrap.style.display='none';
    toggle.classList.remove('on');
    toggle.textContent='弹';
    stopDanmaku();
    showDanmakuOffHint();
  }
}

function showDanmakuOffHint(){
  var hint=document.createElement('div');
  hint.className='dm-off-hint';
  hint.textContent='弹幕已关闭 · 独立思考，欣赏舞台';
  document.body.appendChild(hint);
  setTimeout(function(){ hint.remove(); },2000);
}

function startDanmaku(){
  stopDanmaku();
  spawnDanmaku();
  DM_TIMER=setInterval(spawnDanmaku,3500);
}

function stopDanmaku(){
  if(DM_TIMER){ clearInterval(DM_TIMER); DM_TIMER=null; }
}

function spawnDanmaku(){
  var layer=document.getElementById('danmaku-layer');
  if(!layer||!DM_ON) return;
  var pool=DM_POOL;
  var pick;
  // 20% chance to show a player-posted message
  if(DM_PLAYER_MSGS.length>0&&Math.random()<0.2){
    pick={t:'player',msg:DM_PLAYER_MSGS[Math.floor(Math.random()*DM_PLAYER_MSGS.length)]};
  } else {
    pick=pool[Math.floor(Math.random()*pool.length)];
  }
  var el=document.createElement('div');
  el.className='danmaku-item '+pick.t;
  el.textContent=pick.msg;
  var top=Math.floor(Math.random()*80)+5;
  el.style.top=top+'%';
  var duration=8+Math.random()*5;
  el.style.animationDuration=duration+'s';
  layer.appendChild(el);
  setTimeout(function(){ el.remove(); },duration*1000+200);
}

function postDanmaku(){
  var input=document.getElementById('danmaku-input');
  var txt=input.value.trim();
  if(!txt) return;
  DM_PLAYER_MSGS.push(txt);
  if(DM_PLAYER_MSGS.length>15) DM_PLAYER_MSGS.shift();
  // spawn immediately
  var layer=document.getElementById('danmaku-layer');
  var el=document.createElement('div');
  el.className='danmaku-item player';
  el.textContent=txt;
  el.style.top=(Math.floor(Math.random()*80)+5)+'%';
  el.style.animationDuration='9s';
  layer.appendChild(el);
  setTimeout(function(){ el.remove(); },9200);
  input.value='';
}

// Show/hide danmaku toggle based on game state
function updateDanmakuUI(){
  var toggle=document.getElementById('danmaku-toggle');
  var layer=document.getElementById('danmaku-layer');
  var inputWrap=document.getElementById('danmaku-input-wrap');
  if(S.G&&!S.G.gameEnded&&S.page!=='title'&&S.page!=='world_intro'&&S.page!=='prologue'){
    toggle.style.display='block';
    if(DM_ON){
      layer.style.display='block';
      inputWrap.style.display='flex';
      toggle.classList.add('on');
      toggle.textContent='✕';
      startDanmaku();
    }
  } else {
    toggle.style.display='none';
    if(DM_ON){
      layer.style.display='none';
      inputWrap.style.display='none';
      toggle.classList.remove('on');
      toggle.textContent='弹';
      stopDanmaku();
    }
  }
}

function newGame(){
  var punishers=CHARACTERS.filter(function(c){return c.nemesis;});
  var nemesis=punishers[Math.floor(Math.random()*punishers.length)];
  var bids=CHARACTERS.filter(function(c){return c.bid===2;});
  var cPool=bids.filter(function(c){return c.id!==nemesis.id;});
  var cPos;
  if(nemesis.id===10&&Math.random()<0.1){cPos=CHARACTERS.find(function(c){return c.id===10;});}
  else{cPos=cPool[Math.floor(Math.random()*cPool.length)];}

  S.G={
    phase:1,week:1,day:1,supportPoints:5000,cognitionDissonance:0,
    pulseSensitivity:100,confrontationChances:3,selfReflectionUses:0,maxSelfReflect:3,
    nemesisId:nemesis.id,cPositionId:cPos.id,convictionPoints:0,
    mediumId:28,mediumFound:false,
    eliminated:[],observed:{},suspectList:[],evidenceBoard:{},
    photocards:{},practiceCards:{},cpCards:{},tickets:[],vipTicketWeek:null,
    confrontationHistory:[],gameEnded:false,endingType:null,
    actionsToday:0,maxActions:5,charBatch:0,
    nemesisConfronted:false,sparedNemesis:null,votedCPosition:null,eventSeen:false,performanceSeen:false,
  };
  S.subPage=0;
  S.page='world_intro';
  render();
}

function getTodaySchedule(){
  var G=S.G;
  if(!G) return null;
  return SCHEDULE.find(function(s){return s.w===G.week&&s.d===G.day;})||null;
}

function getNextPerformance(){
  var G=S.G;
  if(!G) return null;
  var cur=(G.week-1)*7+G.day;
  var next=SCHEDULE.filter(function(s){return s.type==='performance'&&((s.w-1)*7+s.d)>=cur;});
  return next.length>0?next[0]:null;
}

function getPerformance(){
  var G=S.G;
  if(!G) return null;
  var key='perf';
  var idx=0;
  if(G.week===2&&G.day===7) idx=1;
  else if(G.week===3&&G.day===4) idx=2;
  else if(G.week===4&&G.day===7) idx=3;
  else if(G.week===5&&G.day===6) idx=4;
  else if(G.week===6&&G.day===7) idx=5;
  else if(G.week===7&&G.day===5) idx=6;
  else return null;
  return PERFORMANCES['perf'+idx];
}

function getDayEra(){
  var G=S.G;
  if(!G) return "C";
  if(G.phase===3) return "T";
  var cycle=["C","K","J","T"];
  return cycle[(G.week-1)%4];
}

function checkPulse(charId){
  var G=S.G;
  var char=CHARACTERS.find(function(c){return c.id===charId;});
  if(!char||char.pulse==="none") return null;
  var lvl=char.pulse;
  if(charId===G.nemesisId){
    var up={weak:"medium",medium:"strong",strong:"extreme",extreme:"extreme"};
    lvl=up[lvl]||lvl;
  }
  if(G.phase===1){var d={extreme:"strong",strong:"medium",medium:"weak",weak:"weak"};lvl=d[lvl]||lvl;}
  if(G.phase===3){var up2={weak:"medium",medium:"strong",strong:"extreme",extreme:"extreme"};lvl=up2[lvl]||lvl;}
  var eff=G.pulseSensitivity-G.cognitionDissonance;
  if(eff<30&&lvl==="weak") lvl="none";
  if(eff<15&&lvl!=="extreme"){var d2={extreme:"strong",strong:"medium",medium:"weak",weak:"none"};lvl=d2[lvl]||lvl;}
  if(lvl==="none") return null;
  var txts=PULSE_TXT[lvl]||PULSE_TXT.medium;
  return{level:lvl,text:txts[Math.floor(Math.random()*txts.length)]};
}

function chooseDailyEvent(choiceIdx){
  var G=S.G;
  var evt=getDailyEvent();
  if(!evt) { go('day_choices'); return; }
  var choice=evt.choices[choiceIdx];
  var eff=choice.effect||{};
  
  // Apply support change (negative = cost, positive = gain)
  if(eff.support!==undefined && eff.support!==0){ G.supportPoints+=eff.support; }
  if(eff.support===undefined && choice.effect && choice.effect.support){ G.supportPoints+=choice.effect.support; }
  if(G.supportPoints<0) G.supportPoints=0;
  
  // Auto-observe a character if specified
  if(eff.observe){
    var cid=eff.observe;
    if(!G.observed[cid]) G.observed[cid]={count:0,signals:[]};
    G.observed[cid].count++;
    G.observed[cid].lastDay='W'+G.week+'D'+G.day;
    // Show first signal
    var char=CHARACTERS.find(function(c){return c.id===cid;});
    if(char && G.observed[cid].signals.length===0){
      var shown=char.signals.slice(0,2);
      G.observed[cid].signals.push.apply(G.observed[cid].signals,shown);
      if(!G.evidenceBoard[cid]) G.evidenceBoard[cid]={confidence:0,clues:[]};
      G.evidenceBoard[cid].confidence+=15;
      shown.forEach(function(s){G.evidenceBoard[cid].clues.push({type:"behavior",text:s,day:"W"+G.week+"D"+G.day});});
    }
  }
  
  // Trigger pulse if specified
  if(eff.pulse_char){
    var pid=eff.pulse_char;
    var pulse=checkPulse(pid);
    if(pulse){
      if(!G.suspectList.includes(pid)) G.suspectList.push(pid);
      if(!G.evidenceBoard[pid]) G.evidenceBoard[pid]={confidence:0,clues:[]};
      var w={weak:5,medium:10,strong:20,extreme:30};
      G.evidenceBoard[pid].confidence+=w[pulse.level]||5;
      G.evidenceBoard[pid].clues.push({type:"pulse",text:pulse.text.substring(0,40)+"...",level:pulse.level,day:"W"+G.week+"D"+G.day});
    }
    eff._pulse=pulse;
  }
  
  // 小王 event as seen
  G.eventSeen=true;
  
  // Store result for rendering
  S.dailyEventResult={
    choiceText:choice.text,
    resultText:choice.effect.result,
    pulse:eff._pulse||null,
    goEvidence:choice.effect.go_evidence,
    goConfront:choice.effect.go_confront,
    goStock:choice.effect.go_stock,
    goCard:choice.effect.go_card,
    eraIntro:choice.effect.eraIntro,
  };
  S.page='daily_event_result';
  autoSave();
  render();
}

  var r=S.dailyEventResult;
  if(r && r.goEvidence){ go('evidence'); return; }
  if(r && r.goConfront){ go('confront_select'); return; }
  if(r && r.goStock){ go('card_exchange'); return; }
  if(r && r.goCard){ go('card_exchange'); return; }
  go('day_choices');
}

function doObserve(id){
  var G=S.G;
  var char=CHARACTERS.find(function(c){return c.id===id;});
  var cost=G.phase===1?(Object.keys(G.observed).length<10?0:100):(G.phase===2?150:200);
  if(G.supportPoints<cost){ showFloatText("彩头不足"); return; }
  G.supportPoints-=cost;
  G.actionsToday++;
  var tpls=BEHAVIOR[char.era];
  var tpl=tpls[Math.floor(Math.random()*tpls.length)];
  var cpLink=CP_LINKS.find(function(l){return l.from===id;});
  var cpName=cpLink?CHARACTERS.find(function(c){return c.id===cpLink.to;}).name:"另一个人";
  var text=tpl.replace(/{name}/g,char.name).replace(/{cp_name}/g,cpName);
  var signalText="";
  if(!G.observed[id]) G.observed[id]={count:0,signals:[]};
  var newSigs=char.signals.filter(function(s){return !G.observed[id].signals.includes(s);});
  if(newSigs.length>0){
    var shown=newSigs.slice(0,Math.min(2,newSigs.length));
    signalText="\n\n【观察到的细节】\n"+shown.map(function(s){return "· "+s;}).join("\n");
    G.observed[id].signals.push.apply(G.observed[id].signals,shown);
    if(!G.evidenceBoard[id]) G.evidenceBoard[id]={confidence:0,clues:[]};
    G.evidenceBoard[id].confidence+=15;
    shown.forEach(function(s){G.evidenceBoard[id].clues.push({type:"behavior",text:s,day:"W"+G.week+"D"+G.day});});
  }
  G.observed[id].count++;
  G.observed[id].lastDay='W'+G.week+'D'+G.day;
  if(id===G.nemesisId&&G.phase>=2&&Math.random()<0.4){
    var extras=["——等等。他的手势和记忆碎片里的画面重合了。","——他的呼吸节奏和上一世那个人一样。","——他说这句话的语调让你后背发冷。"];
    var ex=extras[Math.floor(Math.random()*extras.length)];
    text+="\n\n"+ex;
    if(!G.evidenceBoard[id]) G.evidenceBoard[id]={confidence:0,clues:[]};
    G.evidenceBoard[id].confidence+=25;
    G.evidenceBoard[id].clues.push({type:"reaction",text:ex,day:"W"+G.week+"D"+G.day});
  }
  if(id===G.cPositionId&&G.phase>=2&&Math.random()<0.3){
    var sig=CPOS_SIG[id];
    if(sig&&G.convictionPoints<3){
      text+="\n\n【验证信号】\n· "+sig;
      G.convictionPoints++;
    }
  }
  var pulse=checkPulse(id);
  if(pulse){
    if(!G.suspectList.includes(id)) G.suspectList.push(id);
    if(!G.evidenceBoard[id]) G.evidenceBoard[id]={confidence:0,clues:[]};
    var w2={weak:5,medium:10,strong:20,extreme:30};
    G.evidenceBoard[id].confidence+=w2[pulse.level]||5;
    G.evidenceBoard[id].clues.push({type:"pulse",text:pulse.text.substring(0,40)+"...",level:pulse.level,day:"W"+G.week+"D"+G.day});
  }
  var cardDrop=null;
  var cardChance=hasVipTicket()?0.60:0.35;
  if(Math.random()<cardChance){
    if(Math.random()<0.3){ addPracticeCard(id); cardDrop={name:char.name,type:'practice'}; }
    else { addPhotocard(id); cardDrop=char; }
  }
  autoSave();
  S.observeResult={id:id, text:text+signalText, pulse:pulse, mode:"观察", cardDrop:cardDrop, vip:hasVipTicket()};
  S.page='observe_result';
  render();
}

function doQuickScan(){
  var G=S.G;
  G.actionsToday++;
  var results=[];
  CHARACTERS.forEach(function(c){
    if(G.eliminated.includes(c.id)) return;
    var pulse=checkPulse(c.id);
    if(pulse){
      results.push({char:c,pulse:pulse});
      if(!G.suspectList.includes(c.id)) G.suspectList.push(c.id);
      if(!G.evidenceBoard[c.id]) G.evidenceBoard[c.id]={confidence:0,clues:[]};
      var w={weak:5,medium:10,strong:20,extreme:30};
      G.evidenceBoard[c.id].confidence+=w[pulse.level]||5;
      G.evidenceBoard[c.id].clues.push({type:"pulse",text:"快速扫描触发",level:pulse.level,day:"W"+G.week+"D"+G.day});
    }
  });
  // Quick scan: 15% chance of random photocard drop
  if(Math.random()<0.15){
    var alive=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id);});
    var drop=alive[Math.floor(Math.random()*alive.length)];
    if(Math.random()<0.3){ addPracticeCard(drop.id); S.quickScanCardDrop={name:drop.name,type:'practice',id:drop.id}; }
    else { addPhotocard(drop.id); S.quickScanCardDrop=drop; }
  } else {
    S.quickScanCardDrop=null;
  }
  S.quickScanResults=results;
  autoSave();
  S.page='quick_scan_result';
  render();
}

function getDailySelfieCard(){
  var G=S.G;
  var alive=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id);});
  var cpLinks=CP_LINKS.filter(function(l){
    var c1=alive.find(function(c){return c.id===l.from;});
    var c2=alive.find(function(c){return c.id===l.to;});
    return c1&&c2;
  });

  if(cpLinks.length>0&&Math.random()<0.25){
    var link=cpLinks[Math.floor(Math.random()*cpLinks.length)];
    var c1=CHARACTERS.find(function(c){return c.id===link.from;});
    var c2=CHARACTERS.find(function(c){return c.id===link.to;});
    addCpCard(c1.id,c2.id);
    var soloPool=alive.filter(function(c){return c.id!==c1.id&&c.id!==c2.id;});
    var bonus=null;
    if(soloPool.length>0){
      bonus=soloPool[Math.floor(Math.random()*soloPool.length)];
      addPhotocard(bonus.id);
    }
    return{type:'cp',char1:c1,char2:c2,bonus:bonus};
  }

  var drop=alive[Math.floor(Math.random()*alive.length)];
  addPhotocard(drop.id);
  return{type:'solo',char:drop};
}

// --- Ticket system ---
function grantWeeklyTickets(){
  var G=S.G;
  if(!G.reincarnationId) return; // 阿飘阶段没有门票
  var tier=getReincarnationTier(G.reincarnationScore);
  if(!tier) return;
  G.tickets=[]; // 清零旧门票
  for(var i=0;i<tier.ticketsPerWeek;i++){
    var isFront=Math.random()<tier.frontRowChance;
    G.tickets.push({type:isFront?'front':'back',used:false,week:G.week});
  }
  G.ticketWeek=G.week;
}

function grantReincarnationBonusTickets(){
  var G=S.G;
  if(!G.reincarnationId) return 0;
  if(G.reincarnationBonusGranted) return 0;
  var earlyWeeks=5-G.week;
  if(earlyWeeks<=0) return 0;
  var tier=getReincarnationTier(G.reincarnationScore);
  var bonus=earlyWeeks;
  for(var i=0;i<bonus;i++){
    var isFront=Math.random()<tier.frontRowChance;
    G.tickets.push({type:isFront?'front':'back',used:false,week:G.week,label:'早投胎奖励'});
  }
  G.reincarnationBonusGranted=true;
  autoSave();
  return bonus;
}

function countTickets(){
  var G=S.G;
  if(!G.tickets) return {front:0,back:0,total:0};
  var front=G.tickets.filter(function(t){return t.type==='front'&&!t.used;}).length;
  var back=G.tickets.filter(function(t){return t.type==='back'&&!t.used;}).length;
  return {front:front,back:back,total:front+back};
}

function sellTicket(index){
  var G=S.G;
  if(!G.tickets||!G.tickets[index]||G.tickets[index].used) return;
  var price=G.tickets[index].type==='front'?300:80;
  G.tickets[index].used=true;
  G.tickets[index].sold=true;
  G.supportPoints+=price;
  autoSave();
  showFloatText('卖出'+(G.tickets[index].type==='front'?'前排':'后排')+'门票 +'+price+'彩头');
  render();
}

function useTicketForPerformance(type){
  var G=S.G;
  if(!G.tickets) return false;
  var idx=G.tickets.findIndex(function(t){return t.type===type&&!t.used;});
  if(idx<0) return false;
  G.tickets[idx].used=true;
  G.tickets[idx].usedFor='W'+G.week+'D'+G.day;
  autoSave();
  return true;
}

function hasTicketForPerformance(){
  var tc=countTickets();
  return tc.total>0;
}

function doSelfReflect(){
  var G=S.G;
  if(G.selfReflectionUses>=G.maxSelfReflect||G.cognitionDissonance<5||G.supportPoints<100) return;
  G.selfReflectionUses++;
  G.cognitionDissonance=Math.max(0,G.cognitionDissonance-15);
  G.supportPoints-=100;
  G.actionsToday++;
  autoSave();
  S.page='self_reflect_result';
  render();
}

function endDay(){
  autoSave();
  S.page='diary_night';
  render();
}

function goToSleep(){
  var G=S.G;
  // Safety net: ensure support points never negative, give small allowance if very low
  if(G.supportPoints<0) G.supportPoints=0;
  if(G.supportPoints<200){
    G.supportPoints+=200;
    S.dailyAllowance=true;
  } else {
    S.dailyAllowance=false;
  }
  G.day++;
  var newWeek=false;
  if(G.day>7){G.day=1;G.week++;newWeek=true;}
  if(G.week>8){ triggerEnding("black_rerun"); return; }
  // 第四周结束强制投胎
  if(newWeek&&G.week>=5&&!G.reincarnationId){
    S.pendingReincarnation=true;
    autoSave();
    S.page='reincarnation_event';
    render();
    return;
  }
  // 新的一周：投胎后发放门票
  if(newWeek&&G.reincarnationId){
    grantWeeklyTickets();
    S.newWeekTickets=true;
  }
  G.actionsToday=0;
  G.eventSeen=false;
  G.performanceSeen=false;
  S.dailyCard=getDailySelfieCard();
  autoSave();
  S.page='daily_card';
  render();
}

function startConfront(id){
  S.confrontTarget=id;
  S.page='confront_confirm';
  render();
}

function executeConfront(id){
  var G=S.G;
  var char=CHARACTERS.find(function(c){return c.id===id;});
  var confCost=G.phase===1?500:G.phase===2?2000:5000;
  G.supportPoints=Math.max(0,G.supportPoints-confCost);
  G.confrontationChances--;
  if(G.confrontationChancesUsed===undefined) G.confrontationChancesUsed=0;
  G.confrontationChancesUsed++;
  var isNemesis=(id===G.nemesisId);
  var eb=G.evidenceBoard[id]||{confidence:0,clues:[]};
  var hitChance=Math.min(85,eb.confidence/100*85);
  if(G.phase===3) hitChance+=10;
  var hit=isNemesis&&(Math.random()<hitChance);
  var result=isNemesis?(hit?"hit":"miss"):"wrong";
  G.confrontationHistory.push({charId:id,result:result,day:"W"+G.week+"D"+G.day});
  S.confrontResult={char:char,result:result};
  if(result==="hit"){
    G.nemesisConfronted=true;
    G.supportPoints+=3000;
  } else {
    G.cognitionDissonance+=result==="wrong"?15:10;
  }
  autoSave();
  S.page='confront_result';
  render();
}

function afterConfront(){
  var G=S.G;
  if(G.nemesisConfronted){
    S.page='post_confront';
    render();
  } else if(G.confrontationChances>0){
    S.page='day_morning';
    render();
  } else {
    // 三把钥匙用完，未命中坑豆
    if(G.eliminated.includes(G.nemesisId)){
      // 坑豆已被赛制淘汰 - 被动胜利，等第四周结束投胎
      S.page='day_morning';
      render();
    } else if(G.week>=5){
      // 已过第四周，强制投胎
      S.page='reincarnation_event';
      render();
    } else {
      // 还没到第四周，继续游戏，等第四周结束自动投胎
      S.page='day_morning';
      render();
    }
  }
}

function castVote(id){
  var G=S.G;
  G.votedCPosition=id;
  var ending;
  var mainWon=G.nemesisConfronted;
  var nemesisEl=G.eliminated.includes(G.nemesisId);
  if(mainWon){
    ending=(id===G.cPositionId)?"gold":"silver";
  } else if(nemesisEl){
    ending=(id===G.cPositionId)?"silver_variant":"silver_variant_hollow";
  } else {
    ending=(id===G.cPositionId)?"black_illusory":"black_rerun";
  }
  triggerEnding(ending);
}

function triggerEnding(type){
  S.G.gameEnded=true;
  S.G.endingType=type;
  autoSave();
  S.page='ending';
  render();
}

var SAVE_KEY="donttrust_saves_v3";

function getSaves(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return {auto:null,manual:[]};
    var parsed=JSON.parse(raw);
    return {auto:parsed.auto||null,manual:parsed.manual||[]};
  }catch(e){return {auto:null,manual:[]};}
}

function serializeGame(){
  var G=S.G;
  if(!G) return null;
  return JSON.stringify({
    phase:G.phase,week:G.week,day:G.day,supportPoints:G.supportPoints,
    cognitionDissonance:G.cognitionDissonance,pulseSensitivity:G.pulseSensitivity,
    confrontationChances:G.confrontationChances,selfReflectionUses:G.selfReflectionUses,
    nemesisId:G.nemesisId,cPositionId:G.cPositionId,convictionPoints:G.convictionPoints,
    mediumId:G.mediumId,mediumFound:G.mediumFound,
    confrontationChancesUsed:G.confrontationChancesUsed,
    reincarnationScore:G.reincarnationScore,reincarnationId:G.reincarnationId,
    reincarnationAbilities:G.reincarnationAbilities,
    eliminated:G.eliminated,observed:G.observed,suspectList:G.suspectList,
    evidenceBoard:G.evidenceBoard,photocards:G.photocards,practiceCards:G.practiceCards,cpCards:G.cpCards,tickets:G.tickets,vipTicketWeek:G.vipTicketWeek,
    confrontationHistory:G.confrontationHistory,gameEnded:G.gameEnded,
    endingType:G.endingType,nemesisConfronted:G.nemesisConfronted,sparedNemesis:G.sparedNemesis,
    votedCPosition:G.votedCPosition,actionsToday:G.actionsToday,eventSeen:G.eventSeen,
    maxActions:G.maxActions,maxSelfReflect:G.maxSelfReflect,charBatch:G.charBatch,
    performanceSeen:G.performanceSeen
  });
}

function deserializeGame(str){
  var d=JSON.parse(str);
  S.G=Object.assign({},d);
  if(!S.G.photocards) S.G.photocards={};
  if(!S.G.practiceCards) S.G.practiceCards={};
  if(!S.G.cpCards) S.G.cpCards={};
  if(!S.G.tickets) S.G.tickets=[];
  if(S.G.vipTicketWeek===undefined) S.G.vipTicketWeek=null;
  if(!S.G.observed) S.G.observed={};
  if(!S.G.evidenceBoard) S.G.evidenceBoard={};
  if(!S.G.suspectList) S.G.suspectList=[];
  if(S.G.sparedNemesis===undefined) S.G.sparedNemesis=null;
  if(S.G.maxActions===undefined) S.G.maxActions=5;
  if(S.G.maxSelfReflect===undefined) S.G.maxSelfReflect=3;
  if(S.G.performanceSeen===undefined) S.G.performanceSeen=false;
  if(S.G.mediumId===undefined) S.G.mediumId=28;
  if(S.G.mediumFound===undefined) S.G.mediumFound=false;
  if(S.G.confrontationChancesUsed===undefined) S.G.confrontationChancesUsed=0;
  if(S.G.reincarnationScore===undefined) S.G.reincarnationScore=null;
  if(S.G.reincarnationId===undefined) S.G.reincarnationId=null;
  if(S.G.reincarnationAbilities===undefined) S.G.reincarnationAbilities={};
  if(S.G.revengeFailedPenalty===undefined) S.G.revengeFailedPenalty=false;
  if(S.G.reincarnationBonusGranted===undefined) S.G.reincarnationBonusGranted=false;
}

function autoSave(){
  if(!S.G||S.G.gameEnded) return;
  var s=getSaves();
  s.auto={state:serializeGame(),time:Date.now(),week:S.G.week,day:S.G.day,phase:S.G.phase};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
}

function manualSave(slot){
  if(!S.G) return;
  var s=getSaves();
  s.manual[slot]={state:serializeGame(),time:Date.now(),week:S.G.week,day:S.G.day,phase:S.G.phase,support:S.G.supportPoints};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
  showFloatText("已保存到存档槽"+(slot+1));
  render();
}

function loadAutoSave(){
  var s=getSaves();
  if(!s.auto){ showFloatText("没有自动存档"); return; }
  deserializeGame(s.auto.state);
  if(S.G.nemesisConfronted){
    S.page='post_confront';
  } else {
    S.page='day_morning';
  }
  render();
}

function loadManual(slot){
  var s=getSaves();
  if(!s.manual[slot]) return;
  deserializeGame(s.manual[slot].state);
  S.page='day_morning';
  render();
}

function deleteSave(slot){
  var s=getSaves();
  s.manual[slot]=null;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
  render();
}

function renderProgressBar(){
  var G=S.G;
  if(!G) return '';
  var totalDays=56;
  var currentDay=(G.week-1)*7+G.day;
  var pct=Math.round(currentDay/totalDays*100);
  var phaseNames={1:'等级评价期',2:'策略对战期',3:'总决赛'};
  var phaseShort={1:'P1·等级评价',2:'P2·策略对战',3:'P3·总决赛'};
  var phaseRanges={1:[1,14],2:[15,42],3:[43,56]};
  var pc='p'+G.phase;
  var mainDone=G.nemesisConfronted;
  var mainText=mainDone?('坑豆已确认'+(G.sparedNemesis?'·放过':'·不放过')):'坑豆未找到';

  var markers='';
  var milestones=[
    {day:1,label:'W1'},{day:14,label:'P2',phaseChange:true},
    {day:28,label:'W4'},{day:42,label:'P3',phaseChange:true},
    {day:50,label:'W8'},{day:56,label:'终'}
  ];
  milestones.forEach(function(m){
    var cls='';
    if(currentDay>m.day) cls='passed';
    else if(currentDay===m.day) cls='current';
    markers+='<span class="'+cls+'">'+m.label+'</span>';
  });

  return '<div class="progress-bar-wrap">'+
    '<div class="progress-bar-info">'+
      '<span class="pbi-phase '+pc+'">'+phaseShort[G.phase]+'</span>'+
      '<span>第'+G.week+'周·第'+G.day+'天 ('+currentDay+'/56) · '+mainText+'</span>'+
    '</div>'+
    '<div class="progress-bar-track">'+
      '<div class="progress-bar-fill '+pc+'" style="width:'+pct+'%"></div>'+
    '</div>'+
    '<div class="progress-bar-markers">'+markers+'</div>'+
  '</div>';
}

function renderDayMorning(){

    "闹钟响了三遍。没人能关掉它，也没人能真正醒来。"
  ];

    G.phase=2;
    phaseNote='<p class="thought" style="color:var(--accent)">Phase 2开始。记忆碎片更清晰了——脉冲变得更易辨认。</p>';
  }

    G.phase=3;
    phaseNote='<p class="thought" style="color:var(--danger)">Phase 3开始。半记忆觉醒——脉冲形成清晰的记忆碎片。</p>';
    if(G.cognitionDissonance<30){
      G.pulseSensitivity=Math.min(100,G.pulseSensitivity+20);
      phaseNote+='<p class="thought" style="color:var(--green)">认知失调值低，半记忆完全觉醒。脉冲灵敏度提升。</p>';
    }
  }

  if(G.week>1&&G.day===1){
    var cands=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id)&&c.stock<10&&!(G.photocards[c.id]>0)&&!G.observed[c.id];});
    if(cands.length>0&&Math.random()<0.3){
      var v=cands[Math.floor(Math.random()*cands.length)];
      G.eliminated.push(v.id);
      phaseNote+='<p class="thought" style="color:var(--orange)">'+v.name+'被赛季机制淘汰（退市）。</p>';
    }

    S.page='final_vote';
    return renderFinalVote();
  }

  if(perf&&!G.performanceSeen){
    S.page='performance';
    S.perfSubPage=0;
    return renderPerformance();
  }

  var todaySched=getTodaySchedule();
  var schedNote='';

    if(todaySched.type==='performance'){
      schedNote='<div class="pulse" style="border-color:var(--gold);margin:8px 0">'+

        '<p class="thought">'+todaySched.desc+'</p>'+
      '</div>';
    } else if(todaySched.type==='start'||todaySched.label.indexOf('P2')>=0||todaySched.label.indexOf('P3')>=0){
      schedNote='<p class="thought" style="color:var(--accent)">'+todaySched.icon+' '+todaySched.label+' — '+todaySched.desc+'</p>';
    } else {
      schedNote='<p class="thought">'+todaySched.icon+' 今日：'+todaySched.label+'</p>';
    }
  }

  var nextPerf=getNextPerformance();
  var nextPerfText='';
  if(nextPerf){
    var daysUntil=((nextPerf.w-1)*7+nextPerf.d)-((G.week-1)*7+G.day);
    nextPerfText='<p class="thought" style="color:var(--text-dim);font-size:11px">下一场公演：第'+nextPerf.w+'周第'+nextPerf.d+'天 '+nextPerf.label+'（还有'+daysUntil+'天）</p>';
  }

  return '<p class="narrator">第'+G.week+'周·第'+G.day+'天</p>'+
    '<p>'+morningDesc+'</p>'+
    schedNote+
    '<p class="thought">你翻开日记本。今天有'+(30-G.eliminated.length)+'个人在这座录影棚里。其中一个人毁了你上一世的一切，另一个人值得你这一世的全部信任。</p>'+
    '<p class="thought">你不知道他们是谁。但你的脉搏记得。</p>'+
    phaseNote+
    '<p class="thought">今天你可以做'+(G.maxActions-G.actionsToday)+'件事。</p>'+
    nextPerfText+
    '</div>'+
    '<div class="choices">'+
      '<button class="btn btn-primary choice-btn" onclick="go(\'day_choices\')">今天做什么？ →</button>'+
      '<button class="btn choice-btn" onclick="go(\'schedule\')">查看完整日程表 →</button>'+
    '</div>';
}

  html+='</div><div class="choices"><button class="btn choice-btn" onclick="go(\'day_morning\')">← 返回</button></div>';
  return html;
}

function renderDiaryNight(){
  var G=S.G;
  var nightDescs=[
    "练习室的灯灭了。黑暗中没有人感觉到多了一团雾。",
    "走廊的灯熄了一半。有人在哪个房间里小声哭。你帮不上忙，你是阿飘。",
    "深夜的录影棚很安静。你的雾在暗处更浓了。",
    "灯全关了。黑暗是完整的。在黑暗里，你和活人没有区别。",
    "凌晨两点。有人在翻来覆去。有人在梦话。你飘在走廊里，听着。",
    "夜风从没关好的窗户吹进来。你什么都感觉不到——阿飘没有体温。"
  ];
  var nightDesc=nightDescs[((G.week-1)*7+G.day-1)%nightDescs.length];

  var lines=[];
  lines.push('第'+G.week+'周·第'+G.day+'天结束了。你飘回了日记本旁边。');

  if(G.actionsToday>0){
    var obsToday=Object.keys(G.observed).filter(function(cid){
      var o=G.observed[cid];
      return o.lastDay==='W'+G.week+'D'+G.day;
    });
    if(obsToday.length>0){
      var names=obsToday.map(function(cid){
        var c=CHARACTERS.find(function(ch){return ch.id==cid;});
        return c?c.name:'?';
      });
      lines.push('今天你观察了：'+names.join('、')+'。');
    } else {
      lines.push('今天你做了一些事。虽然没有人让你特别在意。');
    }
  } else {
    lines.push('今天你什么都没做。日记本几乎是空白的。有时候等待也是一种策略。');
  }

  if(G.suspectList.length>0){
    var susNames=G.suspectList.map(function(cid){
      var c=CHARACTERS.find(function(ch){return ch.id==cid;});
      return c?c.name:'?';
    });
    lines.push('你的嫌疑人名单上有'+susNames.length+'个人：'+susNames.join('、')+'。');
  } else {
    lines.push('你还没有找到任何嫌疑人。脉冲还没响过——或者你还没靠近对的人。');
  }

  var ebKeys=Object.keys(G.evidenceBoard);
  if(ebKeys.length>0){
    var topSus=ebKeys.sort(function(a,b){
      return (G.evidenceBoard[b].confidence||0)-(G.evidenceBoard[a].confidence||0);
    })[0];
    var topChar=CHARACTERS.find(function(c){return c.id==topSus;});
    var topConf=Math.min(99.999999,G.evidenceBoard[topSus].confidence||0);
    if(topChar){
      lines.push('证据板上信心值最高的是'+topChar.name+'（'+topConf+'点）。你的直觉在指向他——但直觉会骗人。');
    }
  } else {
    lines.push('证据板还是空的。你需要更多观察。');
  }

  if(G.supportPoints<1000){
    lines.push('彩头不多了。你需要省着花——或者去交易所把多余的小卡卖给系统。');
  }

  var totalCards=Object.values(G.photocards).reduce(function(a,b){return a+b;},0);
  if(totalCards>0){
    lines.push('你收藏了'+totalCards+'张小卡。多余的可以卖给系统换彩头。');
  }

  var remaining=(8-G.week)*7+(7-G.day);
  if(G.week<=2){
    lines.push('赛季才刚开始。你有的是时间。别急。');
  } else if(G.week<=4){
    lines.push('赛季过半了。你的半记忆在变清晰。再等等。');
  } else if(G.week<=6){
    lines.push('时间不多了。还剩'+remaining+'天。你必须开始缩小范围了。');
  } else {
    lines.push('最后'+remaining+'天。你必须做决定了。');
  }

  var html='<p class="narrator">夜</p>'+
    '<p>'+nightDesc+'</p>'+
    '<p class="thought">你回到看台的小隔间。打开日记本。</p>';

  lines.forEach(function(l){
    html+='<p class="thought">「'+l+'」</p>';
  });

  html+='<p class="thought">你合上日记本。熄灯。闭上眼。</p>';

  if(G.week<7){
    html+='<p class="thought">明天又是新的一天。录影棚不会等你。</p>';
  } else {
    html+='<p class="thought" style="color:var(--danger)">明天越来越近了。你必须准备好了。</p>';
  }

  html+='</div><div class="choices">'+
    '<button class="btn btn-primary choice-btn" onclick="goToSleep()">入睡 →</button>'+
    '</div>';

  return html;
}

function getDailyEvent(){
  var G=S.G;
  var evt=DAILY_EVENTS.find(function(e){return e.week===G.week&&e.day===G.day;});
  return evt;
}

function renderDayChoices(){
  var G=S.G;
  var aliveChars=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id);});
  
  var mainChoices=[];
  var secondaryChoices=[];
  
  // === MAIN ACTIONS (prominent) ===
  
  // Daily story event
  var evt=getDailyEvent();
  if(evt && !G.eventSeen){
    mainChoices.push({text:'今日剧情',hint:evt.text.substring(0,24)+'...',action:'daily_event',cls:'dc-event'});
  }
  
  if(aliveChars.length>0 && G.actionsToday<G.maxActions){
    mainChoices.push({text:'去练习室看看',hint:'今天有'+aliveChars.length+'人可以观察',action:'pick_char'});
  }
  if(G.actionsToday<G.maxActions){
    mainChoices.push({text:'快速扫一眼全部30人的状态',hint:'1次行动 · 看看谁触发了脉冲',action:'quick_scan'});
  }
  
  // === SECONDARY ACTIONS (situational) ===
  
  // Reincarnation abilities
  if(G.nemesisConfronted && G.reincarnationId){
    var tier=getReincarnationTier(G.reincarnationScore||0);
    var hasAbility=false;
    for(var abName in G.reincarnationAbilities){
      if(G.reincarnationAbilities[abName]>0){ hasAbility=true; break; }
    }
    if(hasAbility){
      secondaryChoices.push({text:'使用投胎能力（'+tier.name+'）',hint:tier.tier+'级 · 有限次数',action:'use_ability'});
    }
  }
  
  // Medium (通灵者)
  if(G.mediumFound && !G.eliminated.includes(G.mediumId)){
    var med=CHARACTERS.find(function(c){return c.id===G.mediumId;});
    secondaryChoices.push({text:'去找'+med.name+'（通灵者）说话',hint:'唯一能看见你的人 · 对话/线索',action:'medium_talk'});
  } else if(!G.mediumFound && G.actionsToday<G.maxActions){
    if((G.week>1||G.day>=3) && Math.random()<0.4){
      secondaryChoices.push({text:'飘去练习室走廊转转',hint:'也许有人能看到你...?',action:'find_medium'});
    }
  }
  
  if(G.cognitionDissonance>=10 && G.selfReflectionUses<G.maxSelfReflect && G.supportPoints>=100){
    secondaryChoices.push({text:'找个安静的地方自省',hint:'消耗100彩头 · 认知失调-15',action:'self_reflect'});
  }
  
  // Week 8: skip to final vote
  if(G.week===8 && G.day<7){
    secondaryChoices.push({text:'跳到最终投票日',hint:'跳过剩余天数 · 直接进入总决赛',action:'skip_to_final'});
  }
  
  // End day
  mainChoices.push({text:G.actionsToday>0?'今天差不多了，回去写日记':'什么都不做，回去写日记',hint:'结束今天 · 进入下一天',action:'end_day',cls:'dc-end-day'});
  
  // === UTILITY (fixed compact buttons) ===
  var utilityItems=[
    {icon:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',label:'赛程进度',action:'schedule'},
    {icon:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="12" height="16" rx="2"/><rect x="8" y="7" width="8" height="5" rx="1"/><path d="M8 15h6"/></svg>',label:'我的小卡',action:'card_collection'},
    {icon:'<svg viewBox="0 0 24 24"><path d="M7 7h13M7 7l4-4M7 7l4 4"/><path d="M17 17H4M17 17l-4-4M17 17l-4 4"/></svg>',label:'小卡交易所',action:'card_exchange'},
    {icon:'<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M12 6v12"/></svg>',label:'黄牛票市',action:'ticket_market'},
    {icon:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4M11 8v6M8 11h6"/></svg>',label:'我的备忘录',action:'evidence'},
    {icon:'<svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4M9 13h6M9 17h4"/></svg>',label:'保存进度',action:'save_menu'}
  ];
  
  var html='<div class="day-choices">'+
    '<div class="dc-actions-left">剩余行动 <span class="dc-count">'+(G.maxActions-G.actionsToday)+'</span> / '+G.maxActions+'</div>';
  
  // Main choices
  html+='<div class="dc-main">';
  mainChoices.forEach(function(c){
    var cls=c.cls?' '+c.cls:'';
    html+='<button class="btn choice-btn'+cls+'" onclick="handleChoice(\''+c.action+'\')">'+c.text+
      '<span class="choice-hint">'+(c.hint||'')+'</span></button>';
  });
  html+='</div>';
  
  // Secondary choices
  if(secondaryChoices.length>0){
    html+='<div class="dc-section-label">其他</div><div class="dc-secondary">';
    secondaryChoices.forEach(function(c){
      html+='<button class="btn choice-btn" onclick="handleChoice(\''+c.action+'\')">'+c.text+
        '<span class="choice-hint">'+(c.hint||'')+'</span></button>';
    });
    html+='</div>';
  }
  
  // Utility bar
  html+='<div class="dc-utility">';
  utilityItems.forEach(function(u){
    var clickFn = u.action==='save_menu' ? "go('save_menu')" : "handleChoice('"+u.action+"')";
    html+='<button class="dc-utility-item" onclick="'+clickFn+'">'+
      '<span class="dcu-icon">'+u.icon+'</span>'+u.label+'</button>';
  });
  html+='</div>';
  
  // Debug
  if(!G.nemesisConfronted){
    html+='<div class="dc-debug"><button onclick="handleChoice(\'debug_post\')">[测试] 跳到投胎页面</button></div>';
  }
  
  html+='</div>';
  return html;
}

function renderCharSelect(){
  var G=S.G;
  var chars=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id);});
  var batch=G.charBatch||0;
  var batchSize=5;
  var totalPages=Math.ceil(chars.length/batchSize);
  if(batch>=totalPages) batch=0;
  var start=batch*batchSize;
  var pageChars=chars.slice(start,start+batchSize);

  var html='<p class="narrator">练习室</p>'+
    '<p class="thought">第'+(batch+1)+'/'+totalPages+'波 · 选择要观察的人。</p>'+
    '</div><div class="char-pick">';
  pageChars.forEach(function(c){
    var obs=G.observed[c.id];
    var sus=G.suspectList.includes(c.id);
    var held=G.photocards[c.id]||0;
    var code=charCode(c);
    var ls=LEVEL_STYLE[c.level]||LEVEL_STYLE.C;
    html+='<div class="char-pick-item" onclick="pickChar('+c.id+')">'+
      '<div class="cp-name">'+
        '<span class="cp-code" style="color:'+ERA_C[c.era]+';font-family:monospace;font-weight:700">'+code+'</span> '+
        c.name+
        '<span class="cp-level" style="color:'+ls.color+';border:1px solid '+ls.color+';border-radius:2px;padding:0 4px;font-size:10px">'+c.level+'</span>'+
        (sus?'<span class="cp-suspect">疑</span>':'')+
        (held>0?'<span style="color:var(--green);font-size:10px">×'+held+'</span>':'')+
      '</div>'+
      '<div class="cp-info">股价'+c.stock.toFixed(1)+(obs?' · 已观察'+obs.count+'次':'')+'</div>'+
    '</div>';
  });
  html+='</div><div class="choices">';
  if(batch>0){
    html+='<button class="btn choice-btn" onclick="charBatchPrev()">← 上一波</button>';
  }
  if(batch<totalPages-1){
    html+='<button class="btn btn-primary choice-btn" onclick="charBatchNext()">下一波 →</button>';
  }
  html+='<button class="btn choice-btn" onclick="go(\'day_choices\')">← 返回</button></div>';
  return html;
}

function renderDailyEvent(){
  var G=S.G;
  var evt=getDailyEvent();
  if(!evt){ return '<p>今天没有特别的事。</p></div><div class="choices"><button class="btn btn-primary choice-btn" onclick="go(\'day_choices\')">继续 →</button></div>'; }
  var html='<p class="narrator">第'+G.week+'周·第'+G.day+'天 · 剧情事件</p>';
  html+='<p>'+evt.text+'</p>';
  html+='</div><div class="choices">';
  evt.choices.forEach(function(c,i){
    var hint='';
    if(c.effect&&c.effect.support&&c.effect.support>0) hint='消耗'+c.effect.support+'彩头';
    html+='<button class="btn choice-btn" onclick="chooseDailyEvent('+i+')">'+c.text+(hint?'<span class="choice-hint">'+hint+'</span>':'')+'</button>';
  });
  html+='</div>';
  return html;
}

  html+='<p>'+r.resultText+'</p>';
  if(r.eraIntro){
    html+=ERA_INTRO_PAGE.html;
  }

function renderEvidence(){

  var html='<p class="narrator">证据板</p><p class="thought">你翻开日记本的证据页。上面自动记录了你触发过的脉冲和观察到的线索。</p>';
  if(Object.keys(G.evidenceBoard).length===0){
    html+='<p class="thought">还没有收集到任何证据。去观察角色，触发脉冲。</p>';
  } else {
    var sorted=Object.entries(G.evidenceBoard).sort(function(a,b){return b[1].confidence-a[1].confidence;});
    html+='<div class="evidence-panel">';
    sorted.forEach(function(entry){
      var cid=parseInt(entry[0]);
      var eb=entry[1];
      var char=CHARACTERS.find(function(c){return c.id===cid;});
      var conf=Math.min(99.999999,eb.confidence);
      var cColor=conf>60?'var(--green)':conf>30?'var(--orange)':'var(--text-dim)';
      html+='<div class="evidence-item"><div class="ev-name">'+
        '<span style="font-family:monospace;font-weight:700;color:'+ERA_C[char.era]+'">'+charCode(char)+'</span> '+
        char.name+
        '<span class="ev-conf">'+conf+'%<span class="conf-bar"><span class="conf-fill" style="width:'+conf+'%;background:'+cColor+'"></span></span></span></div>';
      eb.clues.forEach(function(cl){
        var t=cl.type==='pulse'?'脉冲':cl.type==='behavior'?'行为':'应激';
        html+='<span class="ev-clue '+cl.type+'">['+cl.day+'] '+t+' · '+cl.text+'</span>';
      });
      html+='</div>';
    });
    html+='</div>';

function spareNemesis(spare){

    G.pulseSensitivity=Math.min(100,G.pulseSensitivity+15);
  } else {
    G.supportPoints+=1000;
  }
  autoSave();
  S.page='confront_result';
  render();
}

function useAbilityOn(charId){
  var G=S.G;
  var abName=S.selectedAbility;
  var cost=S.selectedAbilityCost||0;
  var c=CHARACTERS.find(function(x){return x.id===charId;});
  if(!c) return;

  if(G.supportPoints<cost){ showFloatText('彩头不足'); return; }
  if(!G.reincarnationAbilities[abName]||G.reincarnationAbilities[abName]<=0){ showFloatText('能力次数用完'); return; }

  G.supportPoints-=cost;
  G.reincarnationAbilities[abName]--;

  var resultText='';
  var resultType='';

  // Generate ability result based on ability name
  if(abName==='制造舆论'){
    var reveal=Math.random()<0.6;
    if(reveal){
      var axis=Math.floor(Math.random()*3);
      var axisNames=['舞台热忱','粉丝回馈','CP羁绊'];
      var axisVals=[c.stage,c.fans,c.cp];
      resultText='你发了一条推送。评论区炸了。'+c.name+'的'+axisNames[axis]+'值被曝光：'+axisVals[axis]+'。';
      resultType='reveal';
      if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
      G.evidenceBoard[charId].confidence+=20;
      G.evidenceBoard[charId].clues.push({type:'ability',text:'舆论曝光'+axisNames[axis]+'='+axisVals[axis],day:'W'+G.week+'D'+G.day});
    } else {
      resultText='你发了一条推送。但风向没变——反而有人开始质疑你。你制造的假象反弹回来了。';
      G.cognitionDissonance+=5;
      resultType='backfire';
    }
  } else if(abName==='控评'){
    var boost=Math.random()<0.5;
    if(boost){
      c.stock+=10;
      resultText='你操控了评论区风评。'+c.name+'的小卡价值暴涨。股价+10。';
      resultType='boost';
    } else {
      c.stock-=5;
      resultText='你试图操控风评，但翻车了。'+c.name+'的小卡价值下跌。股价-5。';
      resultType='down';
    }
  } else if(abName==='查阅档案'){
    resultText='你调取了'+c.name+'的内部档案。';
    resultType='reveal';
    var secrets=[
      c.stage>=80?'档案显示：'+c.name+'在原组就是顶级舞台担当。舞台热忱'+c.stage+'，真实。':'档案显示：'+c.name+'的舞台热忱仅'+c.stage+'，低于预期。',
      c.fans>=70?'档案显示：'+c.name+'记住了每一个粉丝的名字。粉丝回馈'+c.fans+'，真实。':'档案显示：'+c.name+'的粉丝回馈仅'+c.fans+'，有备忘录记录嫌疑。',
      c.cp>=70?'档案显示：'+c.name+'与搭档有真实情感连接。CP羁绊'+c.cp+'。':'档案显示：'+c.name+'的CP羁绊仅'+c.cp+'，合作性质偏重。',
    ];
    resultText+=secrets.join(' ');
    if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
    G.evidenceBoard[charId].confidence+=25;
    G.evidenceBoard[charId].clues.push({type:'ability',text:'档案查阅：三轴值'+c.stage+'/'+c.fans+'/'+c.cp,day:'W'+G.week+'D'+G.day});
  } else if(abName==='安排房间'){
    resultText='你调整了宿舍分配。'+c.name+'的隔壁住进了另一个人。深夜你听到了他们的对话——';
    resultType='reveal';
    var nightTalks=[
      '你在走廊听到了'+c.name+'打电话的声音："我知道……我会的。"挂断后沉默了很久。',
      c.cp>=70?'你听到'+c.name+'在隔壁说梦话，叫了一个人的名字。CP羁绊'+c.cp+'，潜意识是真的。':'你听到'+c.name+'在隔壁自言自语："不能让他们发现。"——什么不能被发现？',
      '你听到'+c.name+'在哭。但第二天早上，他笑着出现在练习室，像什么都没发生过。',
    ];
    resultText+=nightTalks[Math.floor(Math.random()*nightTalks.length)];
    if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
    G.evidenceBoard[charId].confidence+=15;
    G.evidenceBoard[charId].clues.push({type:'ability',text:'深夜宿舍观察',day:'W'+G.week+'D'+G.day});
  } else if(abName==='打钱'){
    c.stock+=15;
    var collapse=Math.random()<0.3;
    if(collapse){
      resultText='你给'+c.name+'打了一大笔钱。股价+15。但三天后——塌房信号泄露了。有人开始查他的账。';
      resultType='risk';
      G.cognitionDissonance+=5;
    } else {
      resultText='你给'+c.name+'打了一大笔钱。股价+15。他似乎没有受到太大影响——也许他是真的。';
      resultType='boost';
      if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
      G.evidenceBoard[charId].confidence+=10;
      G.evidenceBoard[charId].clues.push({type:'ability',text:'利益试探：未动摇',day:'W'+G.week+'D'+G.day});
    }
  } else if(abName==='请吃饭'){
    resultText='你以赞助商身份约'+c.name+'吃饭。';
    resultType='reveal';
    var mealReactions=[
      c.fans>=70?c.name+'来了。他在饭桌上问了你很多问题——关于粉丝、关于舞台。他在乎人。':'来了，但全程在看手机。你只是他的资源之一。',
      c.fans>=70?c.name+'吃完饭主动帮你收拾了桌子。"谢谢您。"他说得很认真。':'吃完饭直接走了，连谢谢都没说。',
    ];
    resultText+=mealReactions[Math.floor(Math.random()*mealReactions.length)];
    if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
    G.evidenceBoard[charId].confidence+=18;
    G.evidenceBoard[charId].clues.push({type:'ability',text:'饭局试探',day:'W'+G.week+'D'+G.day});
  } else if(abName==='跟踪'){
    resultText='你尾随了'+c.name+'一整天。';
    resultType='reveal';
    var stalkDetails=[
      '早上练习室：'+c.name+'第一个到，最后一个走。'+(c.stage>=70?'他在练走位——真的努力。':'他在照镜子——调整表情。'),

      '深夜：'+c.name+'没有回宿舍。他去了练习室，一个人练到凌晨两点。'+(c.stage>=80?'他在燃烧自己。真的。':'他在发呆。不练。只是待在那里。'),
    ];
    resultText+=stalkDetails.join(' ');
    if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
    G.evidenceBoard[charId].confidence+=22;
    G.evidenceBoard[charId].clues.push({type:'ability',text:'全天跟踪观察',day:'W'+G.week+'D'+G.day});
    // Stalker has risk of being discovered
    if(Math.random()<0.2){
      resultText+='<br><span style="color:var(--danger)">'+c.name+'回头看了你一眼。他发现你了。他的表情——是厌恶。</span>彩头-200。';
      G.supportPoints=Math.max(0,G.supportPoints-200);
    }
  } else if(abName==='偷拍'){
    var caught=Math.random()<0.15;
    if(caught){
      resultText='你在非公开场合偷拍'+c.name+'——被发现了。保安把你赶了出去。'+c.name+'看了你一眼：不是愤怒，是疲惫。彩头-300。';
      G.supportPoints=Math.max(0,G.supportPoints-300);
      resultType='caught';
    } else {
      resultText='你成功偷拍到了'+c.name+'的独家画面。';
      resultType='reveal';
      var shots=[
        '他在后台一个人对着镜子，做了一个舞台上从来没有的表情——'+(c.fans>=70?'温柔的。真实的。':'冷漠的。像另一张面具。'),
        '他和另一个练习生在后台角落说话——你看到了他们的表情。'+(c.cp>=70?'那是真实的关切。':'那是警告的眼神。'),
        '他在无镜头的时候'+(c.stage>=80?'还在练习走位，一遍又一遍。':'瘫在椅子上，面无表情。'),
      ];
      resultText+=shots[Math.floor(Math.random()*shots.length)];
      if(!G.evidenceBoard[charId]) G.evidenceBoard[charId]={confidence:0,clues:[]};
      G.evidenceBoard[charId].confidence+=20;
      G.evidenceBoard[charId].clues.push({type:'ability',text:'偷拍独家画面',day:'W'+G.week+'D'+G.day});
    }
  } else {
    resultText='能力效果未知。';
    resultType='unknown';
  }

  S.abilityResult={char:c,text:resultText,type:resultType,ability:abName};
  autoSave();
  S.page='ability_result';
  render();
}

function renderPerformanceObserve(){

  var html='<p class="narrator">舞台观察</p>'+
    '<p class="thought">'+perf.observationHint+'</p>'+

    '</div><div class="char-pick">';

  var alive=CHARACTERS.filter(function(c){return !G.eliminated.includes(c.id);});

  pageChars.forEach(function(c){

    var ls=LEVEL_STYLE[c.level]||LEVEL_STYLE.C;
    html+='<div class="char-pick-item" onclick="perfObserveChar('+c.id+')">'+
      '<div class="cp-name">'+

        '<span class="cp-level" style="color:'+ls.color+';border:1px solid '+ls.color+';border-radius:2px;padding:0 4px;font-size:10px">'+c.level+'</span>'+
        (sus?'<span class="cp-suspect">疑</span>':'')+
      '</div>'+
      '<div class="cp-info">股价'+c.stock.toFixed(1)+(obs?' · 已观察'+obs.count+'次':'')+'</div>'+
    '</div>';
  });

  html+='</div><div class="choices">';
  if(batch>0) html+='<button class="btn choice-btn" onclick="charBatchPrev()">← 上一波</button>';
  if(batch<totalPages-1) html+='<button class="btn btn-primary choice-btn" onclick="charBatchNext()">下一波 →</button>';
  html+='<button class="btn choice-btn" onclick="finishPerformance()">跳过 →</button></div>';
  return html;
}

function perfObserveChar(id){
  var G=S.G;
  var c=CHARACTERS.find(function(x){return x.id===id;});
  var perf=getPerformance();
  if(!c||!perf) return;

  if(!G.observed[id]) G.observed[id]={count:0,signals:[],lastDay:''};
  G.observed[id].count++;
  G.observed[id].lastDay='W'+G.week+'D'+G.day+'·公演';

  // Generate stage-specific signals based on ticket type
  var ticketType=G.reincarnationId?(S.perfTicketUsed||'ghost'):'ghost';
  var stageSignals=[
    '【舞台】'+c.name+'的眼神扫过观众席——'+(c.fanScore>=80?'带着真正的光':'带着精确的弧度，像在执行程序')+'。',
    '【舞台】'+c.name+'谢幕时'+(c.fanScore>=70?'自然地笑了':'嘴角上扬但眼睛没有跟着动')+'。',
    '【舞台】'+c.name+'在无镜头间隙'+(c.cpScore>=70?'下意识看向CP搭档的方向':'独自整理服装，没有看向任何人')+'。',
    '【舞台】'+c.name+'的走位'+(c.stageScore>=80?'像刀一样精准':'有几处犹豫，但很快修正')+'。',
    '【舞台】'+c.name+'在表演结束后'+(c.fanScore>=60?'对着观众席挥手':'直接转身走了，没有回头')+'。'
  ];

  var signals=[];
  var confGain=0;
  var isWrong=false;

  if(ticketType==='front'){
    // 前排：2-3条高质量线索
    var numSignals=2+Math.floor(Math.random()*2);
    var shuffled=stageSignals.slice().sort(function(){return Math.random()-0.5;});
    signals=shuffled.slice(0,numSignals);
    confGain=18+Math.floor(Math.random()*8); // 18-25
  } else if(ticketType==='back'){
    // 后排：1条模糊线索，30%概率看错（反向）
    var sig=stageSignals[Math.floor(Math.random()*stageSignals.length)];
    if(Math.random()<0.3){
      // 看错了：生成反向描述
      isWrong=true;
      var wrongSignals=[
        '【舞台·模糊】'+c.name+'的表情看不太清……好像在笑？又好像没有。',
        '【舞台·模糊】太远了。你只看到一个人影在动，细节完全看不清。',
        '【舞台·模糊】'+c.name+'的走位……好像有问题？也可能是你看错了。',
        '【舞台·模糊】灯光晃了一下。你觉得他看向了你这边——应该是错觉。',
        '【舞台·模糊】你听见周围人说'+c.name+'今天状态好。但你看不清。'
      ];
      sig=wrongSignals[Math.floor(Math.random()*wrongSignals.length)];
      confGain=3+Math.floor(Math.random()*3); // 3-5（误导性信息）
    } else {
      sig='【舞台·模糊】'+sig.replace('【舞台】','');
      confGain=5+Math.floor(Math.random()*4); // 5-8
    }
    signals.push(sig);
  } else {
    // 阿飘/默认：1条正常线索
    signals.push(stageSignals[Math.floor(Math.random()*stageSignals.length)]);
    confGain=12;
  }

  // Check pulse (阿飘阶段脉冲正常；投胎后前排脉冲正常，后排脉冲减弱)
  var pulseResult=null;
  var pulseChanceMod=1;
  if(ticketType==='back') pulseChanceMod=0.5; // 后排看不清，脉冲概率减半
  if(Math.random()<pulseChanceMod){
    pulseResult=checkPulse(id);
  }
  var pulseText='';
  if(pulseResult){
    if(!G.suspectList.includes(id)) G.suspectList.push(id);
    pulseText='<div class="pulse"><p style="color:var(--danger)"><strong>脉冲触发</strong></p>'+
      '<p>'+pulseResult.text+'</p></div>';
  }

  // Update evidence board
  if(!G.evidenceBoard[id]) G.evidenceBoard[id]={confidence:0,clues:[]};
  signals.forEach(function(s){
    G.evidenceBoard[id].clues.push({day:'W'+G.week+'D'+G.day,text:s,type:'stage'});
  });
  G.evidenceBoard[id].confidence=Math.min(99.999999,G.evidenceBoard[id].confidence+confGain);

  S.perfObserveResult={char:c,signals:signals,pulse:pulseResult,confGain:confGain,isWrong:isWrong,ticketType:ticketType};
  S.page='perf_observe_result';
  render();
}

function finishPerformance(){
  var G=S.G;
  var perf=getPerformance();
  if(!perf){ go('day_morning'); return; }
  G.performanceSeen=true;
  S.perfTicketUsed=null; // 重置门票使用状态

  // Apply eliminations
  var elimNote='';
  if(perf.eliminateCount>0&&perf.eliminateFilter){
    var cands=CHARACTERS.filter(function(c){
      return !G.eliminated.includes(c.id)&&perf.eliminateFilter(c);
    });
    // Sort by stock ascending
    cands.sort(function(a,b){return a.stock-b.stock;});
    var toElim=cands.slice(0,perf.eliminateCount);
    toElim.forEach(function(c){
      G.eliminated.push(c.id);
      elimNote+='<p class="thought" style="color:var(--orange)">'+c.name+'被淘汰。股价'+c.stock.toFixed(1)+'，未能过线。</p>';
    });
  }

  S.perfResultText=perf.resultText;
  S.perfElimNote=elimNote;
  autoSave();
  S.page='performance_result';
  render();
}

function calcReincarnationScore(){
  var G=S.G;
  var score=0;
  score+=G.supportPoints*0.5;
  score+=(3-G.confrontationChancesUsed)*500;
  if(G.sparedNemesis) score+=800;
  if(G.pulseSensitivity>80) score+=500;
  var correctPulses=G.suspectList.filter(function(id){
    return id===G.nemesisId;
  }).length;
  score+=correctPulses*300;
  var obsCount=Object.keys(G.observed).length;
  score+=Math.min(obsCount*50,500);
  var cardCount=0;
  for(var k in G.photocards) cardCount+=G.photocards[k];
  score+=Math.min(cardCount*10,300);
  return Math.floor(score);
}

function getReincarnationTier(score){
  for(var i=0;i<REINCARNATION_TIERS.length;i++){
    if(score>=REINCARNATION_TIERS[i].minScore) return REINCARNATION_TIERS[i];
  }
  return REINCARNATION_TIERS[REINCARNATION_TIERS.length-1];
}

    html+='<div class="char-pick-item" onclick="castVote('+c.id+')">'+
      '<div class="cp-name">'+
      '<span class="cp-code" style="color:'+ERA_C[c.era]+';font-family:monospace;font-weight:700">'+charCode(c)+'</span> '+
      c.name+
      '<span class="cp-level" style="color:'+ls.color+';border:1px solid '+ls.color+';border-radius:2px;padding:0 4px;font-size:10px">'+c.level+'</span>'+
      (cards>0?'<span style="color:var(--green);font-size:12px">小卡×'+cards+'</span>':'')+
      '</div>'+
      '<div class="cp-info">投票消耗全部彩头</div></div>';
  });
  html+='</div>';
  return html;
}

function renderEnding(){
  var G=S.G;
  var endings={
    gold:{t:"金色·改写命运",c:"ending-gold",d:"你飘到了坑豆，当面窥忆，命中。然后你把全部信任投给了对的人。上一世的灰烬里，你重新学会了信。这一次，你没有选错。"},
    silver:{t:"银色·复仇的代价",c:"ending-silver",d:"你飘到了坑豆，窥忆命中。但最终投票时，你选错了C位。复仇成功了，但守护失败了。你赢了骨头，输了肉。"},
    silver_variant:{t:"银色变体·被动胜利",c:"ending-silver",d:"你的坑豆被赛季机制淘汰了——你没有主动面对他，但至少他走了。你碰巧投对了C位。不算赢，但也没输干净。"},
    silver_variant_hollow:{t:"银色变体·空洞",c:"ending-silver",d:"坑豆被淘汰了，你没主动面对他。C位也投错了。你什么都没做到，只是看着一切结束了。"},
    black_illusory:{t:"黑色·虚妄的救赎",c:"ending-black",d:"你没能找到坑豆——三次窥忆全部错杀。但你碰巧投对了C位。看起来你赢了，但你知道那不过是运气。你的判断力从未被校准。下一世，你可能还会选错。"},
    black_rerun:{t:"黑色·重蹈覆辙",c:"ending-black",d:"你没能找到坑豆，也投错了C位。上一世你被骗到一无所有，这一世你什么都没改变。灰烬里没有重生，只有重复。"},
  };

  var tierLabel=e.c==='gold'?'金色结局':(e.c==='silver'?'银色结局':'黑色结局');

  return '<div class="ending '+endingClass+'">'+

    '<div class="ed-desc">'+e.d+'</div>'+

      '<p>坑豆：<strong style="color:var(--danger)">'+nem.name+'</strong> · C位：<strong style="color:var(--gold)">'+cPos.name+'</strong></p>'+
      '<p>窥忆：'+(G?G.confrontationHistory.length:0)+'次 · 失调：'+(G?G.cognitionDissonance:0)+'</p>'+
      (tier?'<p>投胎：'+tier.tier+'级 · '+tier.name+' · '+G.reincarnationScore+'分</p>':'')+
      (G&&G.sparedNemesis!==null?'<p>最终选择：'+(G.sparedNemesis?'<span style="color:var(--green)">放过</span>':'<span style="color:var(--danger)">不放过</span>')+'</p>':'')+
    '</div>'+
    '<div class="btn-group">'+
      '<button class="btn btn-primary" onclick="newGame()">再玩一局</button>'+
      '<button class="btn" onclick="S.page=\'title\';render()">回到标题</button>'+

function renderSaveMenu(){
  var s=getSaves();
  var html='<p class="narrator">站姐日记本</p>';
  if(s.auto){
    html+='<div class="save-item"><div><strong>自动存档</strong><div class="si-meta">第'+s.auto.week+'周第'+s.auto.day+'天 · P'+s.auto.phase+' · '+new Date(s.auto.time).toLocaleString()+'</div></div>'+
      '<button class="btn" onclick="loadAutoSave()">读取</button></div>';
  }
  for(var i=0;i<5;i++){
    var m=s.manual[i];
    html+='<div class="save-item"><div><strong>存档'+(i+1)+'</strong>';
    if(m){ html+='<div class="si-meta">第'+m.week+'周第'+m.day+'天 · P'+m.phase+' · 应援'+m.support+'<br>'+new Date(m.time).toLocaleString()+'</div>'; }
    else{ html+='<div class="si-meta">[空]</div>'; }
    html+='</div><div class="btn-group">'+
      '<button class="btn btn-primary" onclick="manualSave('+i+')">保存</button>'+
      '<button class="btn" onclick="loadManual('+i+')"'+(m?'':' disabled')+'>读取</button>'+
      '<button class="btn btn-danger" onclick="deleteSave('+i+')"'+(m?'':' disabled')+'>删</button>'+
    '</div></div>';
  }
  html+='</div><div class="choices">'+
    '<button class="btn choice-btn" onclick="go(\'day_morning\')">← 返回游戏</button>'+
    '<button class="btn choice-btn" onclick="exportSave()" style="border-color:var(--accent);color:var(--accent)">导出存档</button>'+
    '<button class="btn choice-btn" onclick="document.getElementById(\'import-file\').click()">导入存档</button>'+
  '</div>'+
  '<input type="file" id="import-file" accept=".json" style="display:none" onchange="importSave(event)">'+
  '<p class="thought" style="font-size:11px;margin-top:8px;text-align:center">导出存档会下载一个JSON文件，可用于备份或迁移。导入存档会覆盖当前数据。</p>';
  return html;
}

function exportSave(){
  var raw=localStorage.getItem(SAVE_KEY);
  if(!raw){
    showFloatText('没有存档数据');
    return;
  }
  var blob=new Blob([raw],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  var ts=new Date();
  var stamp=ts.getFullYear()+'-'+String(ts.getMonth()+1).padStart(2,'0')+'-'+String(ts.getDate()).padStart(2,'0')+'_'+String(ts.getHours()).padStart(2,'0')+String(ts.getMinutes()).padStart(2,'0');
  a.download='donttrust_save_'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showFloatText('存档已导出');
}

function importSave(ev){
  var file=ev.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.auto&&!data.manual){
        showFloatText('存档文件格式错误');
        return;
      }
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));
      showFloatText('存档已导入，请刷新页面');
      setTimeout(function(){location.reload();},1500);
    }catch(err){
      showFloatText('存档文件解析失败');
    }
  };
  reader.readAsText(file);
}

function showFloatText(msg){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:2px;z-index:9999;font-size:13px';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},2000);
}

function debugJump(w,d){
  var G=S.G;
  if(!G){ newGame(); G=S.G; }
  G.week=w; G.day=d; G.actionsToday=0;
  G.eventSeen=false; G.performanceSeen=false;
  G.phase=w>=7?3:(w>=3?2:1);
  if(w>=3) G.pulseSensitivity=Math.max(G.pulseSensitivity,40);
  if(w>=7) G.pulseSensitivity=Math.max(G.pulseSensitivity,70);
  autoSave();
  S.page='day_morning';
  render();
}
window.debugJump=debugJump;

function debugPostConfront(){
  var G=S.G;
  if(!G){ newGame(); G=S.G; }
  // Simulate successful confrontation
  G.nemesisConfronted=true;
  G.sparedNemesis=true;
  if(!G.eliminated.includes(G.nemesisId)) G.eliminated.push(G.nemesisId);
  G.supportPoints+=3000;
  G.pulseSensitivity=Math.min(100,G.pulseSensitivity+15);
  G.confrontationHistory.push({charId:G.nemesisId,result:'hit',day:'W'+G.week+'D'+G.day});
  S.confrontResult={char:CHARACTERS.find(function(c){return c.id===G.nemesisId;}),result:'hit'};
  // Calculate reincarnation
  G.reincarnationScore=calcReincarnationScore();
  var tier=getReincarnationTier(G.reincarnationScore);
  G.reincarnationId=tier.id;
  G.reincarnationAbilities={};
  tier.abilities.forEach(function(ab){ G.reincarnationAbilities[ab.name]=ab.uses; });
  autoSave();
  S.page='post_confront';
  render();
}
window.debugPostConfront=debugPostConfront;
